services:
  - type: web
    name: ida-angola-oportunidades
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ida-oportunidades-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: CREATOR_EMAIL
        sync: false
      - key: CREATOR_PASSWORD_HASH
        sync: false
      - key: TRUST_PROXY
        value: "1"
databases:
  - name: ida-oportunidades-db
    plan: free
